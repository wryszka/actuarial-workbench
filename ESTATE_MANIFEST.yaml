# ── Spine edges — the value chain. `live` = BOTH ends' views deployed AND
#    joinable on `via`. None are live yet: the workbenches have not published the
#    shared-key spine views a real cross-node join needs (see MANIFEST_GAPS.md),
#    so every edge is `planned` and renders dashed / non-traversable. The map
#    must never draw a planned edge as live.
edges:
  - {from: pricing,      to: claims,     via: policy_id,          status: planned}
  - {from: claims,       to: reserving,  via: policy_number,      status: planned}
  - {from: reserving,    to: solvency2,  via: qrt_id,             status: planned}
  - {from: reserving,    to: ifrs17,     via: accident_year,      status: planned}
  - {from: underwriting, to: claims,     via: policy_id,          status: planned}
  - {from: reinsurance,  to: claims,     via: treaty_id,          status: planned}
  - {from: claims,       to: claim-to-confidence, via: claim_id,   status: planned}
  - {from: claim-to-confidence, to: reinsurance,  via: treaty_id,  status: planned}
