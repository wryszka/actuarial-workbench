    name: Reserving Workbench
    repo: wryszka/reserving-workbench
    status: live
    app_url: https://reserving-workbench-7474656169654171.aws.databricksapps.com
    local_tower_url: https://reserving-workbench-7474656169654171.aws.databricksapps.com/#committee
    published_views:
      headline: lr_dev_aws_us_catalog.reserving_workbench.regulatory_landing   # reserve → QRT-cell landing (real published view)
      health: TODO      # no dedicated anomaly/status view published yet — see MANIFEST_GAPS.md
    audit_source: lr_dev_aws_us_catalog.reserving_workbench.`5_gov_audit_event`
    mcp:
      - name: reserving-workbench
        kind: custom-app
        endpoint: https://reserving-workbench-7474656169654171.aws.databricksapps.com/api/mcp
        profile: internal
        contracts_url: https://reserving-workbench-7474656169654171.aws.databricksapps.com/#agent
    spine:
      keys_published: [lob, accident_year]   # triangle grain; policy/claim keys not yet published — see gaps

