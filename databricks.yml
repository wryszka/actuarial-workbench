bundle:
  name: actuarial_workbench_hub

# ──────────────────────────────────────────────────────────────────────────────
# Variables — single source of truth.
#
# This bundle deploys ONE Databricks App: a launcher ("Actuarial Workbench")
# whose tiles open the apps that own each workflow. It holds no data — no
# catalog, schema, or warehouse. The only configuration is the URL each live
# tile opens, read from env by the app (see src/app/server/config.py).
#
# To target a different workspace, override per-target below or pass --var on
# `databricks bundle` commands.
# ──────────────────────────────────────────────────────────────────────────────

variables:
  # — App identity —
  app_name:
    description: Databricks Apps resource name (URL slug — hyphens, not underscores)
    default: actuarial-workbench
  app_display_name:
    description: User-visible app display name
    default: Actuarial Workbench
  entity_name:
    description: Reporting undertaking shown in the landing header (synthetic)
    default: "Bricksurance SE"

  # — Live-tile targets —
  # Databricks Apps live at <app-name>-<number>.aws.databricksapps.com. The app
  # NAMES are identical across workspaces; only <number> changes per workspace.
  # So switching workspaces is a one-line change: set apps_domain_number for the
  # target and every live-tile URL re-derives. (dev=...654171, serverless=...789953)
  apps_domain_number:
    description: Per-workspace Databricks Apps domain number — the only part of the app URLs that changes between workspaces
    default: "7474656169654171"
  solvency_app_url:
    description: Deployed Solvency II workbench Databricks App URL (derived from apps_domain_number)
    default: "https://solvency2-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  pricing_app_url:
    description: Deployed pricing workbench Databricks App URL (derived from apps_domain_number)
    default: "https://pricing-workbench-${var.apps_domain_number}.aws.databricksapps.com/"
  claims_app_url:
    description: Deployed claims workbench Databricks App URL (derived from apps_domain_number)
    default: "https://claims-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  reinsurance_app_url:
    description: Deployed reinsurance workbench Databricks App URL (derived from apps_domain_number)
    default: "https://reinsurance-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  lifecast_app_url:
    description: Deployed LifeCast workbench Databricks App URL (derived from apps_domain_number)
    default: "https://lifecast-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  underwriting_app_url:
    description: Deployed underwriting workbench Databricks App URL (derived from apps_domain_number)
    default: "https://underwriting-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  ifrs17_app_url:
    description: Deployed IFRS 17 workbench Databricks App URL (derived from apps_domain_number)
    default: "https://ifrs17-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  reserving_app_url:
    description: Deployed Reserving workbench Databricks App URL (derived from apps_domain_number)
    default: "https://reserving-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  gtm_cockpit_url:
    description: Deployed UKI Insurance GTM Cockpit Databricks App URL (derived from apps_domain_number)
    default: "https://gtm-cockpit-${var.apps_domain_number}.aws.databricksapps.com"

  # — Accelerator deep links —
  # The SAS migration + Excel accelerator tiles open in-hub detail pages that
  # deep-link into the workspace (notebooks, jobs, pipeline, dashboard, tables).
  # These pointers are per-workspace; empty values just hide the affected link.
  catalog_name:
    description: Unity Catalog holding the accelerator schemas/tables
    default: ""
  excel_folder_path:
    description: Workspace folder holding the Excel accelerator demo notebooks
    default: ""
  excel_app_url:
    description: URL of the Excel Accelerator front-door app (empty hides the link)
    default: ""
  sas_schema:
    description: Schema for the SAS migration demo (sas_migration)
    default: ""
  sas_notebook_path:
    description: Workspace path of the SAS migration demo notebook
    default: ""

  # — Bricksurance Agent (hub concierge chatbot) —
  # Empty warehouse/catalog disables the agent so the hub still runs anywhere.
  agent_warehouse_id:
    description: SQL warehouse the Bricksurance Agent uses (empty disables it)
    default: ""
  agent_catalog:
    description: Catalog holding the bricksurance_agent schema (knowledge + requests)
    default: ""
  agent_schema:
    description: Schema for the agent's knowledge + request-log tables
    default: "bricksurance_agent"
  agent_fm_endpoint:
    description: Foundation Model API endpoint (Claude) the agent calls
    default: "databricks-claude-sonnet-4-5"

  # — Group Control Tower (the hub's first data-aware feature; all data access is
  #   confined to server/group/). Empty warehouse disables the tower's live reads. —
  group_warehouse_id:
    description: SQL warehouse the Group Control Tower uses for view passthroughs + audit union (empty disables live reads)
    default: ""
  group_model_endpoint:
    description: Model-serving endpoint the Group chat wires MCP tools to
    default: "databricks-claude-sonnet-4-5"
  group_catalog:
    description: Catalog holding the group activity log + audit-union sources
    default: ""
  group_identity_mode:
    description: "secret-scope | app-principal — identity resolution for chat profiles (fallback = app-principal, documented in GROUP_ARCHITECTURE.md)"
    default: "app-principal"

  # — Workspace / auth —
  workspace_host:
    description: Databricks workspace URL — override per target
    default: "https://fevm-lr-dev-aws-us.cloud.databricks.com"
  databricks_profile:
    description: Databricks CLI profile to use for deploys
    default: "DEV"

workspace:
  host: ${var.workspace_host}
  profile: ${var.databricks_profile}

sync:
  # Force-include the built SPA: dist/ is in .gitignore (rebuilt on deploy), and
  # `databricks bundle deploy` respects .gitignore, so without this the frontend
  # never uploads and the app 404s. sync.include overrides .gitignore.
  include:
    - src/app/frontend/dist/**
  exclude:
    - src/app/.venv/
    - src/app/frontend/node_modules/
    - "*.bak"

targets:
  # ─ dev ─ FE dev workspace (sits alongside the Solvency II + Pricing apps).
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
    variables:
      app_name: actuarial-workbench
      app_display_name: Actuarial Workbench
      entity_name: "Bricksurance SE"
      apps_domain_number: "7474656169654171"   # dev workspace — solvency + pricing URLs derive from this
      workspace_host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      databricks_profile: DEV
      # Accelerator deep links (dev workspace) — captured after install.
      catalog_name: lr_dev_aws_us_catalog
      excel_folder_path: /Workspace/Shared/actuarial-excel-accelerator
      excel_app_url: "https://excel-accelerator-${var.apps_domain_number}.aws.databricksapps.com"
      sas_schema: sas_migration
      sas_notebook_path: /Workspace/Users/laurence.ryszka@databricks.com/sas_migration/files/sas_migration_demo
      # Bricksurance Agent (dev) — schema + tables provisioned 2026-07-28.
      agent_warehouse_id: a3b61648ea4809e3
      agent_catalog: lr_dev_aws_us_catalog
      # Group Control Tower (dev) — same warehouse; audit union + activity log in lr_dev.
      group_warehouse_id: a3b61648ea4809e3
      group_catalog: lr_dev_aws_us_catalog
      group_model_endpoint: databricks-claude-sonnet-4-5
      group_identity_mode: app-principal

  # ─ serverless ─ FEVM serverless workspace. Same app names; only the domain
  # number changes. Accelerator deep-link IDs would need re-capturing if the
  # accelerators are installed there too.
  serverless:
    mode: development
    workspace:
      host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      profile: sfevm
    variables:
      app_name: actuarial-workbench
      app_display_name: Actuarial Workbench
      entity_name: "Bricksurance SE"
      apps_domain_number: "7474659673789953"   # serverless workspace
      workspace_host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      databricks_profile: sfevm

  prod:
    mode: production
