bundle:
  name: actuarial_workbench_hub

# ──────────────────────────────────────────────────────────────────────────────
# Variables — single source of truth.
#
# This bundle deploys ONE Databricks App: a launcher ("Actuarial Workbench")
# whose tiles open the apps that own each workflow. It holds no data — no
# catalog, schema, or warehouse. The only configuration is the URL each live
# tile opens, read from env by the app (see src/app/server/config.py).
#
# To target a different workspace, override per-target below or pass --var on
# `databricks bundle` commands.
# ──────────────────────────────────────────────────────────────────────────────

variables:
  # — App identity —
  app_name:
    description: Databricks Apps resource name (URL slug — hyphens, not underscores)
    default: actuarial-workbench
  app_display_name:
    description: User-visible app display name
    default: Actuarial Workbench
  entity_name:
    description: Reporting undertaking shown in the landing header (synthetic)
    default: "Bricksurance SE"

  # — Live-tile targets —
  # Databricks Apps live at <app-name>-<number>.aws.databricksapps.com. The app
  # NAMES are identical across workspaces; only <number> changes per workspace.
  # So switching workspaces is a one-line change: set apps_domain_number for the
  # target and every live-tile URL re-derives. (dev=...654171, serverless=...789953)
  apps_domain_number:
    description: Per-workspace Databricks Apps domain number — the only part of the app URLs that changes between workspaces
    default: "7474656169654171"
  solvency_app_url:
    description: Deployed Solvency II workbench Databricks App URL (derived from apps_domain_number)
    default: "https://solvency2-workbench-${var.apps_domain_number}.aws.databricksapps.com"
  pricing_app_url:
    description: Deployed pricing workbench Databricks App URL (derived from apps_domain_number)
    default: "https://pricing-workbench-${var.apps_domain_number}.aws.databricksapps.com/"

  # — Accelerator deep links —
  # The SAS migration + Excel accelerator tiles open in-hub detail pages that
  # deep-link into the workspace (notebooks, jobs, pipeline, dashboard, tables).
  # These pointers are per-workspace; empty values just hide the affected link.
  catalog_name:
    description: Unity Catalog holding the accelerator schemas/tables
    default: ""
  excel_schema:
    description: Schema for the Excel accelerator (actuarial_excel_demo)
    default: ""
  excel_folder_path:
    description: Workspace folder holding the Excel accelerator demo notebooks
    default: ""
  excel_rfr_job_id:
    description: Job ID — EIOPA RFR ETL (demo 1)
    default: ""
  excel_pipeline_id:
    description: DLT pipeline ID — silver_rfr (demo 1)
    default: ""
  excel_scr_job_id:
    description: Job ID — SCR Standard Formula full run (demo 2A)
    default: ""
  excel_dashboard_id:
    description: Lakeview dashboard ID — SCR Standard Formula (demo 2A)
    default: ""
  sas_schema:
    description: Schema for the SAS migration demo (sas_migration)
    default: ""
  sas_notebook_path:
    description: Workspace path of the SAS migration demo notebook
    default: ""
  sas_job_id:
    description: Job ID — SAS migration demo run
    default: ""

  # — Workspace / auth —
  workspace_host:
    description: Databricks workspace URL — override per target
    default: "https://fevm-lr-dev-aws-us.cloud.databricks.com"
  databricks_profile:
    description: Databricks CLI profile to use for deploys
    default: "DEV"

workspace:
  host: ${var.workspace_host}
  profile: ${var.databricks_profile}

sync:
  # Force-include the built SPA: dist/ is in .gitignore (rebuilt on deploy), and
  # `databricks bundle deploy` respects .gitignore, so without this the frontend
  # never uploads and the app 404s. sync.include overrides .gitignore.
  include:
    - src/app/frontend/dist/**
  exclude:
    - src/app/.venv/
    - src/app/frontend/node_modules/
    - "*.bak"

targets:
  # ─ dev ─ FE dev workspace (sits alongside the Solvency II + Pricing apps).
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
    variables:
      app_name: actuarial-workbench
      app_display_name: Actuarial Workbench
      entity_name: "Bricksurance SE"
      apps_domain_number: "7474656169654171"   # dev workspace — solvency + pricing URLs derive from this
      workspace_host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      databricks_profile: DEV
      # Accelerator deep links (dev workspace) — captured after install.
      catalog_name: lr_dev_aws_us_catalog
      excel_schema: actuarial_excel_demo
      excel_folder_path: /Workspace/Users/laurence.ryszka@databricks.com/actuarial-excel-accelerator/files
      excel_rfr_job_id: "969701202189574"
      excel_pipeline_id: "ae34d594-04e4-4cc3-a8bc-bb6eb02cff35"
      excel_scr_job_id: "556927127597290"
      excel_dashboard_id: "01f14ea722b81bc89379a7285dd464a3"
      sas_schema: sas_migration
      sas_notebook_path: /Workspace/Users/laurence.ryszka@databricks.com/sas_migration/files/sas_migration_demo
      sas_job_id: "120511278698684"

  # ─ serverless ─ FEVM serverless workspace. Same app names; only the domain
  # number changes. Accelerator deep-link IDs would need re-capturing if the
  # accelerators are installed there too.
  serverless:
    mode: development
    workspace:
      host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      profile: sfevm
    variables:
      app_name: actuarial-workbench
      app_display_name: Actuarial Workbench
      entity_name: "Bricksurance SE"
      apps_domain_number: "7474659673789953"   # serverless workspace
      workspace_host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      databricks_profile: sfevm

  prod:
    mode: production
