command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: APP_DISPLAY_NAME
    value: ${var.app_display_name}
  - name: ENTITY_NAME
    value: ${var.entity_name}
  - name: SOLVENCY_APP_URL
    value: ${var.solvency_app_url}
  - name: PRICING_APP_URL
    value: ${var.pricing_app_url}
  - name: CLAIMS_APP_URL
    value: ${var.claims_app_url}
  - name: REINSURANCE_APP_URL
    value: ${var.reinsurance_app_url}
  - name: LIFECAST_APP_URL
    value: ${var.lifecast_app_url}
  - name: UNDERWRITING_APP_URL
    value: ${var.underwriting_app_url}
  - name: IFRS17_APP_URL
    value: ${var.ifrs17_app_url}
  - name: RESERVING_APP_URL
    value: ${var.reserving_app_url}
  - name: GTM_COCKPIT_URL
    value: ${var.gtm_cockpit_url}
  # — Workspace + catalog for accelerator deep links —
  - name: WORKSPACE_HOST
    value: ${var.workspace_host}
  - name: CATALOG_NAME
    value: ${var.catalog_name}
  # — Excel accelerator (actuarial-excel-accelerator) — notebooks only —
  - name: EXCEL_FOLDER_PATH
    value: ${var.excel_folder_path}
  - name: EXCEL_APP_URL
    value: ${var.excel_app_url}
  # — SAS migration (sas_migration) —
  - name: SAS_SCHEMA
    value: ${var.sas_schema}
  - name: SAS_NOTEBOOK_PATH
    value: ${var.sas_notebook_path}
  # — Bricksurance Agent (concierge chatbot) — empty disables it —
  - name: AGENT_WAREHOUSE_ID
    value: ${var.agent_warehouse_id}
  - name: AGENT_CATALOG
    value: ${var.agent_catalog}
  - name: AGENT_SCHEMA
    value: ${var.agent_schema}
  - name: AGENT_FM_ENDPOINT
    value: ${var.agent_fm_endpoint}
